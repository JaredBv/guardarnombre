<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardar Nombre en Firebase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="text-center mb-4">Guardar Nombre en Firebase</h1>
  <div class="card p-4 shadow">
    <form id="nombreForm">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
    <div id="mensaje" class="mt-3 text-success"></div>
  </div>
</div>

<!-- Firebase SDKs vía CDN -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAjUxTwIoB89cwiPQ7IPduYgib7bnWgUCs",
    authDomain: "guardarnombreweb.firebaseapp.com",
    databaseURL: "https://guardarnombreweb-default-rtdb.firebaseio.com",
    projectId: "guardarnombreweb",
    storageBucket: "guardarnombreweb.appspot.com",
    messagingSenderId: "467035735195",
    appId: "1:467035735195:web:2e238ac5eb9d963712323e",
    measurementId: "G-SY3RP9J3Y5"
  };

  // Inicializa Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // Envío del formulario
  document.getElementById("nombreForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const nombre = document.getElementById("nombre").value;

    database.ref("nombres").push({ nombre: nombre })
      .then(() => {
        document.getElementById("mensaje").textContent = "✅ Nombre guardado correctamente.";
        document.getElementById("nombreForm").reset();
      })
      .catch((error) => {
        console.error("❌ Error al guardar:", error);
      });
  });
</script>

</body>
</html>
